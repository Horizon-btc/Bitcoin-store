version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: btc-datum-experimental_datum_1
      APP_PORT: 21010

  datum:
    image: ghcr.io/retropex/datum:v1.14-blake2b-4@sha256:1b2e8ecb7a376ebf9b12d0726a263dfc13202566df4a97a87f905af28148910b
    entrypoint: ["/app/datum_gateway"]
    command: ["--config=/app/conf/datum_gateway_config.json"]
    user: 1000:1000
    restart: on-failure
    # Match Debian's DATUM Gateway systemd service (LimitNOFILE=65535).
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    volumes:
      - ${APP_DATA_DIR}/data/settings/:/app/conf/
    ports:
      # datum gateway port
      - 23340:23340
