version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: $APP_ELECTRSBLAKE2B_IP
      APP_PORT: 3006

  app:
    image: ghcr.io/retropex/umbrel-electrs:v1.0.4@sha256:944fbd79a5c6136216ad695d05c4631a80f23c56a81a8b0cad85b5c424f13a31
    depends_on:
      - electrs
    restart: on-failure
    environment:
      ELECTRUM_HIDDEN_SERVICE: "${APP_ELECTRS_RPC_HIDDEN_SERVICE}"
      ELECTRUM_LOCAL_SERVICE: "${DEVICE_DOMAIN_NAME}"
      ELECTRS_HOST: "${APP_ELECTRSBLAKE2B_NODE_IP}"
      BITCOIN_HOST: "${APP_BITCOIN_NODE_IP}"
      RPC_USER: "${APP_BITCOIN_RPC_USER}"
      RPC_PASSWORD: "${APP_BITCOIN_RPC_PASS}"
      RPC_PORT: "${APP_BITCOIN_RPC_PORT}"
      ELECTRUM_PORT: "${APP_ELECTRSBLAKE2B_NODE_PORT}"
    networks:
      default:
        ipv4_address: $APP_ELECTRSBLAKE2B_IP
  
  electrs:
    image: ghcr.io/horizon-btc/electrs:v0.10.10-blake2b.3@sha256:fc1fe3cc430553287c2e869adcd075fcc576cc56d65a961dd7f1975934fd9f62
    restart: always
    environment:
      ELECTRS_LOG_FILTERS: "INFO"
      ELECTRS_NETWORK: "${APP_BITCOIN_NETWORK_ELECTRS}"
      ELECTRS_DAEMON_RPC_ADDR: "${APP_BITCOIN_NODE_IP}:${APP_BITCOIN_RPC_PORT}"
      ELECTRS_DAEMON_P2P_ADDR: "${APP_BITCOIN_NODE_IP}:${APP_BITCOIN_P2P_WHITEBIND_PORT-${APP_BITCOIN_P2P_PORT}}"
      ELECTRS_ELECTRUM_RPC_ADDR: "0.0.0.0:${APP_ELECTRSBLAKE2B_NODE_PORT}"
      ELECTRS_SERVER_BANNER: "Umbrel Electrs (${APP_VERSION})"
      ELECTRS_DB_DIR: "/data/db"
    volumes:
      - "${APP_BITCOIN_DATA_DIR}:/data/.bitcoin:ro"
      - "${APP_DATA_DIR}/data/electrs:/data"
    ports:
      - "${APP_ELECTRSBLAKE2B_NODE_PORT}:${APP_ELECTRSBLAKE2B_NODE_PORT}"
    networks:
      default:
        ipv4_address: $APP_ELECTRSBLAKE2B_NODE_IP

  tor:
    image: ghcr.io/getumbrel/tor:0.4.9.11@sha256:e382b8629c0dfef6ceb396b062622d4e4e955b19d6f16b883fd2c0723ad5671a
    user: "1000:1000"
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/torrc:/etc/tor/torrc:ro
      - ${TOR_DATA_DIR}:/data
    environment:
      HOME: "/tmp"
