version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: btc-datum_datum_1
      APP_PORT: 21009

  datum:
    image: ghcr.io/horizon-btc/datum:v1.14-blake2b-7@sha256:05202cd363e5265489672b84d1837a43ca77a3421e7e894b5b5182b2b22de392
    entrypoint: ["/app/datum_gateway"]
    command: ["--config=/app/conf/datum_gateway_config.json"]
    user: 1000:1000
    restart: on-failure
    # Match Debian's DATUM Gateway systemd service (LimitNOFILE=65535).
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    volumes:
      - ${APP_DATA_DIR}/data/settings/:/app/conf/
    ports:
      # datum gateway port
      - 23339:23339
