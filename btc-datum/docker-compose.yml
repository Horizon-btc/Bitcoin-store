version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: btc-datum_datum_1
      APP_PORT: 21009

  datum:
    image: ghcr.io/horizon-btc/datum:v1.14-blake2b-6@sha256:a1a0fb99e7bbab4498661139ff13a58de74c6fff01ac3547f0aa247a770fb5e4
    entrypoint: ["/app/datum_gateway"]
    command: ["--config=/app/conf/datum_gateway_config.json"]
    user: 1000:1000
    restart: on-failure
    # Match Debian's DATUM Gateway systemd service (LimitNOFILE=65535).
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    volumes:
      - ${APP_DATA_DIR}/data/settings/:/app/conf/
    ports:
      # datum gateway port
      - 23339:23339
